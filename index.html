<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4a525c">
<title>Turnos</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root { --di:#bf8fbf; --n:#7accc8; --m:#85cc9a; --barra:#4a525c; --linea:#222; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:#f2f2f2; font-family:Roboto, system-ui, sans-serif; color:#222; }
  body { display:flex; flex-direction:column; }
  header { background:var(--barra); color:#fff; padding:8px 12px; display:flex; align-items:center; gap:10px; }
  header h1 { font-size:20px; margin:0; flex:1; font-weight:600; }
  header button { background:none; border:2px solid #fff6; color:#fff; border-radius:8px; padding:5px 9px; font-size:17px; }
  .mes { display:flex; align-items:center; justify-content:space-between; padding:8px 6px 4px; background:#fff; }
  .mes h2 { margin:0; font-size:24px; font-weight:700; letter-spacing:.5px; text-transform:uppercase; }
  .mes button { background:none; border:none; font-size:34px; padding:0 14px; color:#333; line-height:1; }
  .dias, .rejilla { display:grid; grid-template-columns:repeat(7,1fr); background:#fff; }
  .dias div { text-align:center; font-weight:700; color:#4a5f78; padding:4px 0 6px; font-size:15px; }
  .rejilla { flex:1; grid-template-rows:repeat(6,1fr); gap:2px; background:#555; border-top:2px solid #555; border-bottom:2px solid #555; }
  .c { position:relative; background:#fff; display:flex; align-items:center; justify-content:center; font-size:20px; min-height:64px; user-select:none; }
  .c .num { position:absolute; top:3px; right:5px; font-size:17px; }
  .c.Di { background:var(--di); } .c.N { background:var(--n); color:#065a5a; } .c.M { background:var(--m); }
  .c.fuera::after { content:''; position:absolute; inset:0; background:rgba(255,255,255,.65); }
  .c.fuera { color:#999; }
  .c.hoy .num { font-weight:700; }
  .c.fest .num { color:#d00; font-weight:700; }
  .c .fn { position:absolute; left:2px; right:2px; bottom:3px; font-size:10px; line-height:1.1; color:#c00; font-weight:700; text-align:center; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
  .c.hoy { box-shadow:inset 0 0 0 3px #222; }
  .c .nota { position:absolute; left:2px; right:2px; top:22px; font-size:10px; line-height:1.15; color:#222; text-align:center; overflow:hidden; max-height:3.5em; word-break:break-word; }
  .c.connota { align-items:flex-end; padding-bottom:16px; }
  .c .sobre { position:absolute; top:4px; left:4px; font-size:11px; }
  #notaBox { position:fixed; inset:0; background:#0008; display:none; align-items:center; justify-content:center; z-index:30; padding:16px; }
  #notaBox.si { display:flex; }
  #notaBox .panel { background:#fff; border-radius:12px; padding:14px; width:100%; max-width:420px; }
  #notaBox h3 { margin:0 0 8px; font-size:18px; }
  #notaBox textarea { width:100%; height:110px; font-size:17px; padding:8px; border:1px solid #bbb; border-radius:8px; font-family:inherit; }
  #notaBox .botones { margin-top:10px; }
  .pie { background:#fff; padding:8px 10px calc(10px + env(safe-area-inset-bottom)); display:flex; flex-direction:column; gap:8px; }
  .leyenda { display:flex; justify-content:space-around; font-size:13px; }
  .leyenda span { display:flex; align-items:center; gap:5px; }
  .leyenda i { width:16px; height:16px; border-radius:3px; display:inline-block; }
  .paleta { display:flex; gap:6px; }
  .paleta button { flex:1; border:2px solid #ccc; border-radius:10px; padding:6px 2px; font-size:18px; font-weight:700; color:#222; display:flex; flex-direction:column; align-items:center; }
  .paleta button small { font-size:11px; font-weight:400; }
  .paleta button.activo { border:3px solid #111; box-shadow:0 0 0 2px #fff inset; transform:scale(1.05); }
  .botones { display:flex; gap:8px; }
  .botones button { flex:1; font-size:16px; padding:12px 6px; border-radius:10px; border:none; background:var(--barra); color:#fff; font-weight:600; }
  .botones button.sec { background:#e4e6ea; color:#222; }
  .botones button:disabled { opacity:.4; }
  .ayuda { font-size:12px; color:#777; text-align:center; }
  /* pantalla de la foto */
  #capa { position:fixed; inset:0; background:#000d; display:none; flex-direction:column; z-index:9; color:#fff; }
  #capa.si { display:flex; }
  #capa .txt { padding:12px; font-size:16px; text-align:center; }
  #lienzoBox { flex:1; overflow:auto; display:flex; justify-content:center; align-items:flex-start; }
  #lienzo { max-width:100%; touch-action:manipulation; }
  #capa .botones { padding:10px; }
  #resumen { background:#fff; color:#222; margin:0 10px; border-radius:10px; padding:10px; display:none; }
  #resumen .selmes { display:flex; align-items:center; justify-content:space-between; font-weight:700; font-size:18px; }
  #resumen .selmes button { font-size:26px; border:none; background:none; padding:0 12px; }
  #mini { display:grid; grid-template-columns:repeat(7,1fr); gap:2px; margin-top:6px; }
  #mini div { font-size:12px; text-align:center; padding:3px 0; background:#eee; border-radius:3px; }
  #mini div.Di { background:var(--di); } #mini div.N { background:var(--n); } #mini div.M { background:var(--m); }
  #mini div.fuera { opacity:.25; }
  #toast { position:fixed; left:50%; bottom:110px; transform:translateX(-50%); background:#222; color:#fff; padding:10px 16px; border-radius:20px; font-size:15px; display:none; z-index:20; max-width:90%; text-align:center; }
</style>
</head>
<body>
<header>
  <h1>📅 Turnos</h1>
  <button id="btnInstalar" style="display:none;background:#fff;color:#222">Instalar</button>
  <button id="btnFoto" aria-label="Foto de su calendario">📷</button>
  <button id="btnGal" aria-label="Elegir de la galería">🖼️</button>
  <button id="btnHoy">Hoy</button>
</header>
<div class="mes">
  <button id="ant" aria-label="Mes anterior">‹</button>
  <h2 id="titulo"></h2>
  <button id="sig" aria-label="Mes siguiente">›</button>
</div>
<div class="dias"><div>LUN</div><div>MAR</div><div>MIÉ</div><div>JUE</div><div>VIE</div><div>SÁB</div><div>DOM</div></div>
<div class="rejilla" id="rejilla"></div>
<div class="pie">
  <div class="paleta" id="paleta">
    <button data-p="Di" style="background:var(--di)">Di<small>8–20</small></button>
    <button data-p="M" style="background:var(--m)">M<small>8–15</small></button>
    <button data-p="N" style="background:var(--n)">N<small>20–8</small></button>
    <button data-p="" style="background:#fff">🧽<small>Borrar</small></button>
  </div>
  <div class="ayuda" id="ayuda">Elige un color y toca los días para pintarlos · Mantén pulsado un día para escribir una nota</div>
</div>
<input type="file" id="fFoto" accept="image/*" capture="environment" hidden>
<input type="file" id="fGal" accept="image/*" hidden>

<div id="capa">
  <div class="txt" id="capaTxt"></div>
  <div id="lienzoBox"><canvas id="lienzo"></canvas></div>
  <div id="resumen">
    <div class="selmes"><button id="rAnt">‹</button><span id="rMes"></span><button id="rSig">›</button></div>
    <div id="mini"></div>
    <div id="mover" style="display:flex;gap:8px;justify-content:center;align-items:center;margin-top:8px;font-size:14px">Mover rejilla:
      <button id="mArriba" style="font-size:20px;padding:2px 16px">▲</button><button id="mAbajo" style="font-size:20px;padding:2px 16px">▼</button></div>
  </div>
  <div class="botones">
    <button id="cCancelar" class="sec">Cancelar</button>
    <button id="cMarcar" class="sec">Marcar a mano</button>
    <button id="cGuardar">Guardar</button>
  </div>
</div>
<div id="notaBox"><div class="panel">
  <h3 id="notaTit"></h3>
  <textarea id="notaTxt" placeholder="Escribe una nota…"></textarea>
  <div class="botones">
    <button id="nBorrar" class="sec">Borrar</button>
    <button id="nCancelar" class="sec">Cancelar</button>
    <button id="nGuardar">Guardar</button>
  </div>
</div></div>
<div id="toast"></div>

<script src="lector.js"></script>
<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var MESES = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
  var CLAVE = "turnos-v1", CICLO = ["", "Di", "N", "M"];
  var datos = {};
  try { datos = JSON.parse(localStorage.getItem(CLAVE) || "null"); } catch(e) { datos = null; }
  if (!datos) {
    /* turnos ya leídos de las fotos de noviembre y diciembre de 2026 */
    datos = {};
    var ini = { "2026-11": {1:"Di",3:"Di",4:"Di",5:"Di",9:"Di",10:"N",12:"Di",14:"Di",15:"N",21:"N",23:"M",24:"M",25:"Di",26:"N",29:"M"},
                "2026-12": {1:"Di",2:"N",5:"N",7:"M",8:"Di",12:"Di",13:"Di",17:"Di",18:"N",21:"Di",25:"Di",26:"Di",29:"N"},
                "2027-01": {2:"M",3:"Di",4:"N",9:"N",10:"N"} };
    Object.keys(ini).forEach(function(m){ Object.keys(ini[m]).forEach(function(d){ datos[m + "-" + ("0" + d).slice(-2)] = ini[m][d]; }); });
    guardar();
  }
  var notas = {};
  try { notas = JSON.parse(localStorage.getItem("turnos-notas") || "{}") || {}; } catch(e) { notas = {}; }
  function guardarNotas(){ try { localStorage.setItem("turnos-notas", JSON.stringify(notas)); } catch(e) {} }
  function guardar(){ try { localStorage.setItem(CLAVE, JSON.stringify(datos)); } catch(e) {} }
  function clave(f){ return f.getFullYear() + "-" + ("0" + (f.getMonth() + 1)).slice(-2) + "-" + ("0" + f.getDate()).slice(-2); }
  /* lunes de la semana en la que cae el día 1 del mes */
  function inicioRejilla(a, m){ var f = new Date(a, m, 1), dw = (f.getDay() + 6) % 7; return new Date(a, m, 1 - dw); }
  function toast(t, ms){ var e = $("toast"); e.textContent = t; e.style.display = "block"; clearTimeout(toast.t); toast.t = setTimeout(function(){ e.style.display = "none"; }, ms || 2500); }

  /* festivos */
  function pascua(a){ var b=a%19,c=Math.floor(a/100),d=a%100,e=Math.floor(c/4),f=c%4,g=Math.floor((c+8)/25),h=Math.floor((c-g+1)/3),
    i=(19*b+c-e-h+15)%30,k=Math.floor(d/4),l=d%4,m=(32+2*f+2*k-i-l)%7,n=Math.floor((b+11*i+22*m)/451),mes=Math.floor((i+m-7*n+114)/31),dia=((i+m-7*n+114)%31)+1;
    return new Date(a, mes-1, dia); }
  var cacheFest = {};
  /* calendario laboral oficial de Castilla-La Mancha (nacionales + autonómicos), cambia cada año por decreto */
  var CLM = {
    2026: [[1,1,"Año Nuevo"],[1,6,"Reyes"],[4,2,"Jueves Santo"],[4,3,"Viernes Santo"],[4,6,"Lunes de Pascua"],[5,1,"Día del Trabajo"],
           [6,4,"Corpus Christi"],[8,15,"Asunción"],[10,12,"Fiesta Nacional"],[11,2,"Todos los Santos"],[12,8,"Inmaculada"],[12,25,"Navidad"]],
    2027: [[1,1,"Año Nuevo"],[1,6,"Reyes"],[3,25,"Jueves Santo"],[3,26,"Viernes Santo"],[5,1,"Día del Trabajo"],[5,27,"Corpus Christi"],
           [5,31,"Día de C-LM"],[10,12,"Fiesta Nacional"],[11,1,"Todos los Santos"],[12,6,"Constitución"],[12,8,"Inmaculada"],[12,25,"Navidad"]]
  };
  function festivos(a){
    if (cacheFest[a]) return cacheFest[a];
    var f = {};
    if (CLM[a]) { CLM[a].forEach(function(x){ f[clave(new Date(a, x[0]-1, x[1]))] = x[2]; }); return (cacheFest[a] = locales(a, f)); }
    /* años sin calendario publicado aún: nacionales + Semana Santa + Día de Castilla-La Mancha */
    var fijos = [[1,1,"Año Nuevo"],[1,6,"Reyes"],[5,1,"Día del Trabajo"],[5,31,"Día de C-LM"],[8,15,"Asunción"],[10,12,"Fiesta Nacional"],
      [11,1,"Todos los Santos"],[12,6,"Constitución"],[12,8,"Inmaculada"],[12,25,"Navidad"]];
    fijos.forEach(function(x){ f[clave(new Date(a, x[0]-1, x[1]))] = x[2]; });
    var p = pascua(a);
    f[clave(new Date(a, p.getMonth(), p.getDate()-3))] = "Jueves Santo";
    f[clave(new Date(a, p.getMonth(), p.getDate()-2))] = "Viernes Santo";
    return (cacheFest[a] = locales(a, f));
  }
  /* fiestas locales: Chinchilla (todos los años) y Albacete */
  function locales(a, f){
    var l = [[8,6,"V. de las Nieves"],[9,29,"San Miguel"],[9,8,"V. de los Llanos"]];
    if (a === 2026) l.push([6,24,"Local Albacete"]);
    l.forEach(function(x){ var k = clave(new Date(a, x[0]-1, x[1])); if (!f[k]) f[k] = x[2]; });
    return f;
  }
  function festivo(f){ return festivos(f.getFullYear())[clave(f)] || ""; }
  var hoy = new Date(), vA = hoy.getFullYear(), vM = hoy.getMonth();
  function pintar(){
    $("titulo").textContent = MESES[vM] + " " + vA;
    var r = $("rejilla"); r.innerHTML = "";
    var f0 = inicioRejilla(vA, vM), kh = clave(new Date());
    for (var i = 0; i < 42; i++) {
      var f = new Date(f0.getFullYear(), f0.getMonth(), f0.getDate() + i), k = clave(f), t = datos[k] || "";
      var c = document.createElement("div");
      var fe = festivo(f);
      c.className = "c " + t + (f.getMonth() !== vM ? " fuera" : "") + (k === kh ? " hoy" : "") + (fe ? " fest" : "") + (notas[k] && t ? " connota" : "");
      var no = notas[k] || "";
      c.innerHTML = '<span class="num">' + f.getDate() + "</span>" + (t || "") + (fe ? '<span class="fn">' + fe + "</span>" : "") +
        (no ? '<span class="sobre">✉</span><span class="nota"></span>' : "");
      if (no) c.querySelector(".nota").textContent = no;
      c.dataset.k = k;
      var pulsado = null, largo = false, tx = 0, ty = 0, movido = false;
      c.addEventListener("touchstart", function(e){ var el = this; largo = false; movido = false; tx = e.touches[0].clientX; ty = e.touches[0].clientY;
        pulsado = setTimeout(function(){ if (!movido) { largo = true; abrirNota(el.dataset.k); } }, 550); }, { passive:true });
      c.addEventListener("touchmove", function(e){ if (Math.abs(e.touches[0].clientX - tx) > 10 || Math.abs(e.touches[0].clientY - ty) > 10) { movido = true; clearTimeout(pulsado); } }, { passive:true });
      c.addEventListener("touchend", function(e){ clearTimeout(pulsado); if (largo) e.preventDefault(); });
      c.addEventListener("contextmenu", function(e){ e.preventDefault(); if (!largo) abrirNota(this.dataset.k); });
      c.addEventListener("click", function(){
        if (largo || movido) { largo = false; movido = false; return; }
        if (pincel === null) { toast("Elige abajo un color para pintar"); return; }
        var k = this.dataset.k;
        if (pincel) datos[k] = pincel; else delete datos[k];
        guardar(); pintar();
      });
      r.appendChild(c);
    }
  }
  var notaK = null;
  function abrirNota(k){
    notaK = k; var p = k.split("-");
    $("notaTit").textContent = "Nota del " + (+p[2]) + " de " + MESES[+p[1] - 1].toLowerCase() + " de " + p[0];
    $("notaTxt").value = notas[k] || "";
    $("notaBox").classList.add("si");
    setTimeout(function(){ $("notaTxt").focus(); }, 100);
  }
  function cerrarNota(){ $("notaBox").classList.remove("si"); notaK = null; }
  $("nCancelar").onclick = cerrarNota;
  $("nGuardar").onclick = function(){ var t = $("notaTxt").value.trim(); if (t) notas[notaK] = t; else delete notas[notaK]; guardarNotas(); cerrarNota(); pintar(); };
  $("nBorrar").onclick = function(){ delete notas[notaK]; guardarNotas(); cerrarNota(); pintar(); };
  var pincel = null; // null = sin pintar; "" = borrar
  Array.prototype.forEach.call(document.querySelectorAll("#paleta button"), function(b){
    b.onclick = function(){
      var p = b.dataset.p;
      pincel = (pincel === p) ? null : p;
      Array.prototype.forEach.call(document.querySelectorAll("#paleta button"), function(x){ x.classList.toggle("activo", pincel !== null && x.dataset.p === pincel); });
      $("ayuda").textContent = pincel === null ? "Elige un color y toca los días para pintarlos · Mantén pulsado un día para escribir una nota"
        : (pincel ? "Pintando " + pincel + ": toca los días. Vuelve a tocar el color para dejar de pintar." : "Borrando: toca los días que quieras dejar libres.");
    };
  });
  function mover(d){ vM += d; if (vM < 0) { vM = 11; vA--; } if (vM > 11) { vM = 0; vA++; } pintar(); }
  $("ant").onclick = function(){ mover(-1); };
  $("sig").onclick = function(){ mover(1); };
  $("btnHoy").onclick = function(){ vA = new Date().getFullYear(); vM = new Date().getMonth(); pintar(); };
  /* deslizar a los lados para cambiar de mes */
  var x0 = null;
  $("rejilla").addEventListener("touchstart", function(e){ x0 = e.touches[0].clientX; }, { passive:true });
  $("rejilla").addEventListener("touchend", function(e){ if (x0 === null) return; var dx = e.changedTouches[0].clientX - x0; x0 = null; if (Math.abs(dx) > 70) mover(dx < 0 ? 1 : -1); });

  /* ---------- foto ---------- */
  var lienzo = $("lienzo"), ctx = lienzo.getContext("2d"), imgData = null, rejillaFoto = null, leidos = null, rA, rM, marcando = 0, esquinas = [];
  $("btnFoto").onclick = function(){ $("fFoto").value = ""; $("fFoto").click(); };
  $("btnGal").onclick = function(){ $("fGal").value = ""; $("fGal").click(); };
  ["fFoto", "fGal"].forEach(function(id){ $(id).addEventListener("change", abrirFoto); });

  function abrirFoto(){
    var f = this.files && this.files[0]; if (!f) return;
    var url = URL.createObjectURL(f), img = new Image();
    toast("Leyendo la foto…");
    img.onload = function(){
      var W = 600, k = W / img.width;
      lienzo.width = W; lienzo.height = Math.round(img.height * k);
      ctx.drawImage(img, 0, 0, lienzo.width, lienzo.height);
      URL.revokeObjectURL(url);
      imgData = ctx.getImageData(0, 0, lienzo.width, lienzo.height);
      rA = vA; rM = vM;
      $("capa").classList.add("si");
      rejillaFoto = LectorTurnos.buscarCuadricula(imgData);
      $("toast").style.display = "none";
      if (rejillaFoto) leer();
      else empezarMarcar("No he encontrado la cuadrícula. ");
    };
    img.onerror = function(){ toast("No se pudo abrir la foto"); };
    img.src = url;
  }
  /* filas de la cuadrícula que tienen días del mes (5 o 6) */
  function filasMes(a, m){ var u = new Date(a, m + 1, 0), dw = (new Date(a, m, 1).getDay() + 6) % 7; return Math.floor((dw + u.getDate() - 1) / 7) + 1; }
  function ultimoDia(a, m){ return new Date(a, m + 1, 0).getDate(); }
  function dibujar(){
    ctx.putImageData(imgData, 0, 0);
    if (!rejillaFoto) return;
    var m = LectorTurnos.mapa(rejillaFoto), F = rejillaFoto.pts ? rejillaFoto.filas : 6;
    ctx.strokeStyle = "#ff0"; ctx.lineWidth = 2;
    function linea(p, q){ ctx.beginPath(); ctx.moveTo(p[0], p[1]); ctx.lineTo(q[0], q[1]); ctx.stroke(); }
    for (var i = 0; i <= 7; i++) linea(m(i, 0), m(i, F));
    for (var j = 0; j <= F; j++) linea(m(0, j), m(7, j));
  }
  function leer(){
    marcando = 0;
    if (rejillaFoto.pts) rejillaFoto.filas = filasMes(rA, rM);
    leidos = LectorTurnos.leerCasillas(imgData, rejillaFoto);
    dibujar();
    $("capaTxt").textContent = "Comprueba que el mes es el de la foto y que los colores de abajo coinciden. Si la rejilla amarilla no cuadra, muévela con ▲ ▼ o pulsa «Marcar a mano».";
    $("mini").style.display = ""; $("mover").style.display = rejillaFoto.pts ? "none" : "flex";
    $("resumen").style.display = "block"; $("cGuardar").disabled = false;
    resumen();
  }
  function resumen(){
    $("rMes").textContent = MESES[rM] + " " + rA;
    var m = $("mini"); m.innerHTML = "";
    if (!leidos) return;
    var f0 = inicioRejilla(rA, rM);
    for (var i = 0; i < 42; i++) {
      var f = new Date(f0.getFullYear(), f0.getMonth(), f0.getDate() + i), t = leidos[i] || "", d = document.createElement("div");
      d.className = (f.getMonth() === rM ? t : "") + (f.getMonth() !== rM ? " fuera" : "");
      d.textContent = f.getDate() + (t && f.getMonth() === rM ? " " + t : "");
      m.appendChild(d);
    }
  }
  function cambiarMes(d){
    rM += d; if (rM < 0) { rM = 11; rA--; } if (rM > 11) { rM = 0; rA++; }
    if (marcando) textoMarcar(); else if (rejillaFoto && rejillaFoto.pts) leer(); else resumen();
    $("rMes").textContent = MESES[rM] + " " + rA;
  }
  $("rAnt").onclick = function(){ cambiarMes(-1); };
  $("rSig").onclick = function(){ cambiarMes(1); };
  /* mover la rejilla automática una fila arriba o abajo */
  function moverRejilla(d){
    if (!rejillaFoto || rejillaFoto.pts) return;
    var ch = (rejillaFoto.y1 - rejillaFoto.y0) / 6;
    rejillaFoto.y0 += d * ch; rejillaFoto.y1 += d * ch; leer();
  }
  $("mArriba").onclick = function(){ moverRejilla(-1); };
  $("mAbajo").onclick = function(){ moverRejilla(1); };

  var PASOS = [
    function(){ return "1/4 · Toca la esquina de ARRIBA a la IZQUIERDA del lunes de la PRIMERA fila (aunque sea de otro mes)."; },
    function(){ return "2/4 · Toca la esquina de ARRIBA a la DERECHA del domingo de la PRIMERA fila."; },
    function(){ return "3/4 · Toca la esquina de ABAJO a la DERECHA del domingo de la fila donde está el día " + ultimoDia(rA, rM) + "."; },
    function(){ return "4/4 · Toca la esquina de ABAJO a la IZQUIERDA del lunes de esa misma fila (la del día " + ultimoDia(rA, rM) + ")."; }
  ];
  function textoMarcar(pre){
    $("capaTxt").textContent = (pre || "") + "Primero elige abajo el mes de la foto. " + PASOS[esquinas.length]();
  }
  function empezarMarcar(pre){
    marcando = 1; esquinas = []; rejillaFoto = null; leidos = null; ctx.putImageData(imgData, 0, 0);
    $("resumen").style.display = "block"; $("mini").style.display = "none"; $("mover").style.display = "none";
    $("cGuardar").disabled = true;
    resumen(); textoMarcar(pre);
  }
  $("cMarcar").onclick = function(){ empezarMarcar(""); };
  lienzo.addEventListener("click", function(e){
    if (!marcando) return;
    var r = lienzo.getBoundingClientRect(), x = (e.clientX - r.left) * lienzo.width / r.width, y = (e.clientY - r.top) * lienzo.height / r.height;
    esquinas.push([x, y]);
    ctx.fillStyle = "#f00"; ctx.beginPath(); ctx.arc(x, y, 7, 0, 7); ctx.fill();
    if (esquinas.length > 1) { var p = esquinas[esquinas.length - 2]; ctx.strokeStyle = "#f00"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(p[0], p[1]); ctx.lineTo(x, y); ctx.stroke(); }
    if (esquinas.length < 4) textoMarcar();
    else { rejillaFoto = { pts: esquinas.slice(), filas: filasMes(rA, rM) }; leer(); }
  });
  function cerrar(){ $("capa").classList.remove("si"); imgData = null; marcando = 0; }
  $("cCancelar").onclick = cerrar;
  $("cGuardar").onclick = function(){
    if (!leidos) return;
    var f0 = inicioRejilla(rA, rM), n = 0;
    for (var i = 0; i < 42; i++) {
      var f = new Date(f0.getFullYear(), f0.getMonth(), f0.getDate() + i);
      if (f.getMonth() !== rM) continue; // los días de otros meses salen difuminados en la foto: no se tocan
      var k = clave(f);
      if (leidos[i]) { datos[k] = leidos[i]; n++; } else delete datos[k];
    }
    guardar(); vA = rA; vM = rM; cerrar(); pintar();
    toast(n + " turnos guardados en " + MESES[rM]);
  };

  pintar();
  var avisoInstalar = null;
  window.addEventListener("beforeinstallprompt", function(e){ e.preventDefault(); avisoInstalar = e; $("btnInstalar").style.display = ""; });
  $("btnInstalar").onclick = function(){ if (!avisoInstalar) return; avisoInstalar.prompt(); avisoInstalar.userChoice.then(function(){ avisoInstalar = null; $("btnInstalar").style.display = "none"; }); };
  window.addEventListener("appinstalled", function(){ $("btnInstalar").style.display = "none"; toast("App instalada"); });
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(function(){});
})();
</script>
</body>
</html>
